[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-attention-bench"
version = "0.1.0"
description = "A reproducible, documented-competition protocol for Muse attention model-agent benchmarking"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT for original harness code; third-party files retain upstream terms"}

[project.scripts]
muse-attention-bench = "muse_attention_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
